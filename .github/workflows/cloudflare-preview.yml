name: Cloudflare preview release

# Releases the `cloudflare` branch to the shared Cloudflare preview, as
# docs/cloudflare-release-runbook.md describes:
# - every check in ci.yml passes first;
# - then one job, under one lock for the whole release, builds the web Worker (changing nothing),
#   refuses unreviewed destructive migrations, migrates DB and CHAT_DB, and deploys the API, chat
#   and web Workers in that order. A failed step stops it: nothing later is deployed;
# - the deployed versions are recorded at the end, for the release receipt.
#
# Off until the repository variable CLOUDFLARE_PREVIEW_DEPLOY is "true". The Cloudflare credentials
# live only in the `cloudflare-preview` GitHub environment: a token for the preview Workers and
# databases only, with the environment's deployments limited to the `cloudflare` branch. Pull
# requests never run this workflow and never see the credentials.

on:
  push:
    branches: [cloudflare]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time across both migrations and all three Workers; never cancelled midway.
concurrency:
  group: cloudflare-preview-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    if: vars.CLOUDFLARE_PREVIEW_DEPLOY == 'true' && github.ref == 'refs/heads/cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: api
      - name: Build the web Worker (changes nothing remote)
        run: npm run cf:build
      # Staging applies only additive migrations; anything destructive needs a reviewed, separate
      # release (and its own approval in production).
      - name: Refuse destructive migrations
        run: |
          if grep -niE "drop (table|column|index)|delete from|rename (to|column)" api/migrations/*.sql api/chat-migrations/*.sql; then
            echo "A migration drops, deletes or renames. Release it deliberately, not from this workflow."
            exit 1
          fi
      - name: Migrate DB (preview)
        working-directory: api
        run: npx wrangler d1 migrations apply DB --env preview --remote
      - name: Migrate CHAT_DB (preview)
        working-directory: api
        run: npx wrangler d1 migrations apply CHAT_DB --env preview --remote --config wrangler.chat.jsonc
      - name: Deploy the API Worker (preview)
        working-directory: api
        run: npx wrangler deploy --env preview
      - name: Deploy the chat Worker (preview)
        working-directory: api
        run: npx wrangler deploy --env preview --config wrangler.chat.jsonc
      - name: Deploy the web Worker (preview)
        run: npx wrangler deploy --env preview
      - name: Record the deployed versions
        run: |
          echo "Source commit: $GITHUB_SHA"
          (cd api && npx wrangler deployments status --env preview)
          (cd api && npx wrangler deployments status --env preview --config wrangler.chat.jsonc)
          npx wrangler deployments status --env preview

name: Clean merged PR previews

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      apply:
        description: Delete eligible previews (false performs a dry run)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: wildhearts-preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Always execute trusted default-branch code, never code from the PR head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Clean merged preview deployments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_CLEANUP_APPLY: ${{ (github.event_name == 'pull_request_target' && vars.PREVIEW_CLEANUP_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.apply == true) }}
        run: node scripts/cleanup-preview-deployments.mjs

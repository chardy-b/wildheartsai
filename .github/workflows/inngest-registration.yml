name: Register production Inngest functions

on:
  deployment_status:
  workflow_dispatch:

permissions: {}

concurrency:
  group: inngest-production-registration
  cancel-in-progress: false

jobs:
  register:
    if: >-
      github.repository == 'chardy-b/wildheartsai' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment.creator.login == 'vercel[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      # The native integration targets a protected Vercel alias. Use the live
      # public origin only after production succeeds; the SDK authenticates the
      # outgoing registration with its server-side Inngest signing key.
      - name: Sync the live production endpoint
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { setTimeout } from "node:timers/promises";

          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              const response = await fetch("https://www.wildheartsai.com/api/inngest", {
                method: "PUT",
                redirect: "error",
                signal: AbortSignal.timeout(30_000),
              });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const result = await response.json();
              if (result.message !== "Successfully registered" || typeof result.modified !== "boolean") {
                throw new Error("Unexpected registration response");
              }
              console.log("Production Inngest registration succeeded.");
              break;
            } catch {
              // Never print response bodies, headers, URLs or exception details.
              console.error(`Production Inngest registration attempt ${attempt} failed.`);
              if (attempt === 3) process.exit(1);
              await setTimeout(10_000);
            }
          }
          JS
